<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SIEAmB</title>
    <script>
      // GitHub Pages SPA trick: save the requested path and bounce to index.
      (function () {
        var base = location.pathname.split('/')[1];
        var basePath = base === 'SIEAmB' ? '/SIEAmB/' : '/';
        sessionStorage.setItem(
          'spa-redirect',
          location.pathname + location.search + location.hash,
        );
        location.replace(basePath);
      })();
    </script>
  </head>
  <body></body>
</html>

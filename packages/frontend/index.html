<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Seminário Internacional de Estudos Ambientais - SIEAmB. UFCG, Programa de Pós-Graduação em Engenharia e Gestão de Recursos Naturais."
    />
    <title>SIEAmB — Seminário Internacional de Estudos Ambientais</title>
    <script>
      // GitHub Pages SPA redirect restore (pairs with public/404.html)
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

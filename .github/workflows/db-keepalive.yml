name: DB keep-alive

# Supabase pauses free projects after a week without activity. A plain SQL
# query through the pooler does not count (sieamb-dev was paused on 18 Oct
# while the pings were green), so this hits the REST API with the anon key
# once a day on both projects (#13, #112). A paused project answers with
# something other than 200 and turns the run red.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prod
            url: SUPABASE_PROD_URL
            key: SUPABASE_PROD_ANON_KEY
          - name: dev
            url: SUPABASE_DEV_URL
            key: SUPABASE_DEV_ANON_KEY
    steps:
      - name: Query ${{ matrix.name }}
        env:
          SUPABASE_URL: ${{ secrets[matrix.url] }}
          ANON_KEY: ${{ secrets[matrix.key] }}
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
          echo "${{ matrix.name }} answered HTTP $status"
          if [ "$status" != "200" ]; then
            cat body.json
            exit 1
          fi

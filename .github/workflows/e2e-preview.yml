name: E2E on Vercel deployment

# Vercel reports every deployment (preview per PR, develop → dev.sieamb.org, main → sieamb.org)
# through GitHub's deployment API. When one succeeds, run the full Playwright suite against it.
# The check lands on the deployed commit, so it shows up on the PR and can be made required.
on:
  deployment_status:

jobs:
  e2e-preview:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against ${{ env.BASE_URL }}
        run: npm run test -w @sieamb/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deployed-${{ github.event.deployment.id }}
          path: packages/e2e/playwright-report/
          retention-days: 7

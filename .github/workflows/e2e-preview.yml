name: E2E on Vercel deployment

# Runs the full Playwright suite against the Vercel deployment of the commit being checked.
# It does not depend on the Vercel GitHub app (which stopped posting deployments on 2026-10-12, #89):
# the deployment URL follows from the branch, and /version.json (emitted by the frontend build)
# tells us when that URL serves the commit under test.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

concurrency:
  group: e2e-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Where the commit under test is served, and not before it is.
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      url: ${{ steps.target.outputs.url }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve the deployment URL for this ref
        id: target
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$BRANCH" in
            main) url="https://sieamb.org" ;;
            develop) url="https://dev.sieamb.org" ;;
            *)
              slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
              url="https://sieamb-git-${slug}-sieamb.vercel.app" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Waiting for $url to serve $SHA"
      - name: Wait for Vercel to serve this commit
        env:
          URL: ${{ steps.target.outputs.url }}
          SHA: ${{ steps.target.outputs.sha }}
          E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            served=$(curl -fsS --max-time 15 -H "x-sieamb-e2e: $E2E_BYPASS_TOKEN" "$URL/version.json?nocache=$i" 2>/dev/null | sed -nE 's/.*"sha":"([0-9a-f]+)".*/\1/p' || true)
            if [ "$served" = "$SHA" ]; then echo "Deployment serves $SHA"; exit 0; fi
            echo "attempt $i: serving '${served:-nothing}'"
            sleep 20
          done
          echo "::error::$URL never served $SHA (30 min). Check the Vercel build for this commit."
          exit 1

  # One job per browser project, side by side (#332): the three engines on a desktop and a
  # phone of each mobile family. `engine` is what Playwright has to install for the project.
  browsers:
    needs: deployment
    name: e2e-preview (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # A failure on one browser says nothing about the others: let them all finish.
      fail-fast: false
      matrix:
        include:
          - { project: chromium, engine: chromium }
          - { project: firefox, engine: firefox }
          - { project: webkit, engine: webkit }
          - { project: mobile, engine: chromium }
          - { project: mobile-safari, engine: webkit }
    env:
      # Every test address of this job carries it, so the job removes its own data and nobody
      # else's (#227, #248). The job index keeps the projects of one run apart: they share the
      # dev database while they run.
      E2E_RUN_ID: r${{ github.run_id }}a${{ github.run_attempt }}p${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Playwright (${{ matrix.project }}) against ${{ needs.deployment.outputs.url }}
        env:
          BASE_URL: ${{ needs.deployment.outputs.url }}
          E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
          # The account tests (#208) read their confirmation links from the dev login
          # service; they skip themselves on production.
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
        run: npm run test -w @sieamb/e2e -- --project=${{ matrix.project }}
      # A run cancelled by a newer push never reaches Playwright's teardown (#248):
      # this step runs whatever happened, removes the job's data and fails if any is left.
      - name: Remove this job's test data
        if: always()
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
        run: npm run cleanup:run -w @sieamb/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deployed-${{ matrix.project }}-${{ needs.deployment.outputs.sha }}
          path: packages/e2e/playwright-report/
          retention-days: 7

  # The check the branch rules require, under the name they know: passes only when every
  # browser passed. A skipped or cancelled browser job is not a pass.
  e2e-preview:
    needs: [deployment, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every browser passed
        env:
          DEPLOYMENT: ${{ needs.deployment.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          echo "deployment: $DEPLOYMENT, browsers: $BROWSERS"
          [ "$DEPLOYMENT" = "success" ] && [ "$BROWSERS" = "success" ]

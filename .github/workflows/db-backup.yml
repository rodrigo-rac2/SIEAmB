name: DB backup

# Weekly logical backup of the production Supabase database. The free tier has
# no point-in-time recovery, so this is the recovery path (#13). Dumps are kept
# as workflow artifacts for 90 days; moving them to R2 is a follow-up.
on:
  schedule:
    - cron: '0 6 * * 0' # Sundays 06:00 UTC (03:00 Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client (pg_dump must be >= the server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # /usr/bin/pg_dump is the postgresql-common wrapper and picks the runner's
          # default cluster version (16), so call the 17 binaries by path.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump public schema and auth users
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DIRECT_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p dump
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom \
            --file "dump/sieamb-prod-public-$STAMP.dump"
          pg_dump "$DB_URL" --data-only --no-owner --no-privileges --format=custom \
            --table=auth.users --table=auth.identities \
            --file "dump/sieamb-prod-auth-$STAMP.dump"
          ls -la dump
          pg_restore --list "dump/sieamb-prod-public-$STAMP.dump" | grep -c "TABLE DATA" | xargs -I{} echo "{} tables with data"

      - uses: actions/upload-artifact@v4
        with:
          name: sieamb-prod-backup-${{ github.run_id }}
          path: dump/
          retention-days: 90
          if-no-files-found: error

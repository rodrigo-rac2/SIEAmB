name: DB backup

# Weekly logical backup of the production Supabase database. The free tier has
# no point-in-time recovery, so this is the recovery path (#13). The repo is
# public and artifacts expire after 90 days, so each dump is encrypted with
# BACKUP_PASSPHRASE and kept as an asset of the `db-backups` release, which
# never expires (#145). Restore steps: docs/db-backups.md.
on:
  schedule:
    - cron: '0 6 * * 0' # Sundays 06:00 UTC (03:00 Brasília)
  workflow_dispatch:
    inputs:
      label:
        description: 'Optional archive label added to the file names, e.g. final-2027'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client (pg_dump must be >= the server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # /usr/bin/pg_dump is the postgresql-common wrapper and picks the runner's
          # default cluster version (16), so call the 17 binaries by path.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump public schema and auth users
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DIRECT_URL }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SAFE_LABEL=$(printf '%s' "${LABEL:-}" | tr -c 'a-zA-Z0-9-' '-' | tr '[:upper:]' '[:lower:]' | sed -E 's/-+/-/g; s/^-|-$//g')
          [ -n "$SAFE_LABEL" ] && STAMP="$STAMP-$SAFE_LABEL"
          mkdir -p dump
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom \
            --file "dump/sieamb-prod-public-$STAMP.dump"
          pg_dump "$DB_URL" --data-only --no-owner --no-privileges --format=custom \
            --table=auth.users --table=auth.identities \
            --file "dump/sieamb-prod-auth-$STAMP.dump"
          ls -la dump
          pg_restore --list "dump/sieamb-prod-public-$STAMP.dump" | grep -c "TABLE DATA" | xargs -I{} echo "{} tables with data"

      - name: Encrypt the dumps
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_PASSPHRASE secret is missing, refusing to publish plain dumps"
            exit 1
          fi
          for f in dump/*.dump; do
            printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f"
            rm -f "$f"
          done
          ls -la dump
          # Prove the passphrase opens what is about to be published.
          for f in dump/*.gpg; do
            printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt "$f" | pg_restore --list >/dev/null
          done
          echo "all dumps decrypt and read back"

      - name: Upload to the db-backups release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view db-backups >/dev/null 2>&1; then
            gh release create db-backups --target "$GITHUB_SHA" --prerelease \
              --title "Database backups (encrypted)" \
              --notes "Weekly encrypted pg_dump files of sieamb-prod. Only the BACKUP_PASSPHRASE opens them, see docs/db-backups.md."
          fi
          gh release upload db-backups dump/*.gpg
          gh release view db-backups --json assets --jq '.assets | length' | xargs -I{} echo "{} backup files in the release"
